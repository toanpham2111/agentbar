[package]
name = "kio-usage-monitor"
version = "1.0.0"
description = "Local-first AI developer tool usage monitor"
authors = ["KIO Digital"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "kio_usage_monitor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "kio-usage-monitor"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = [
  "dep:tauri-build",
  "dep:tauri",
  "dep:tauri-plugin-autostart",
  "dep:tauri-plugin-notification",
]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
uuid = { version = "1", features = ["v4", "serde"] }

tauri = { version = "2", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
