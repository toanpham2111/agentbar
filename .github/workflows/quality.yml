name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-menu-bar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pil dpkg-dev
      - name: Compile
        run: python3 -m compileall -q agentbar tests scripts
      - name: Test
        run: python3 -m unittest discover -s tests -q
      - name: Build Linux installer
        run: python3 scripts/build_linux_release.py 1.0.0
      - name: Verify installer checksum
        working-directory: release
        run: sha256sum -c SHA256SUMS
      - name: Inspect installer
        run: dpkg-deb --info release/Kio-Usage-Monitoring_1.0.0_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: kio-usage-monitoring-linux-amd64
          path: release/*
          if-no-files-found: error

  web-frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and Component tests
        run: npm test
      - name: Build web application
        run: npm run build

  rust-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check code formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - name: Clippy lints
        run: cargo clippy --no-default-features --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Core tests
        run: cargo test --no-default-features --manifest-path src-tauri/Cargo.toml
